name: hidayah_life
description: "Hidayah Life - Free-forever Islamic native app with prayer times, duas, surahs, and platform access."
publish_to: 'none'

version: 1.2.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  local_notifier: ^0.1.6
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#041A13"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_icon.png
    - assets/fonts/HindSiliguri/
    - assets/fonts/Amiri/
    - assets/data/duas.json
    - assets/data/salah_adhkar.json

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri/HindSiliguri-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri/Amiri-Bold.ttf
          weight: 700
